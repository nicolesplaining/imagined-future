[provenance]
cosmos_commit = "9aa98e5a0773a5558f07d2699e640858f7ca8827"
cosmos_framework_commit = "d4599e2e43fbd06168e9884205b9b66c3902d8f6"
robolab_commit = "9db0aaf09d9fe5d4f37b168320788258c7012463"
checkpoint = "nvidia/Cosmos3-Nano-Policy-DROID"
checkpoint_revision = "2b9f9517efcfbf26e222945b386ae9b65c0930ac"
container_digest = "sha256:c2e321b92c692934a885702b3bbd230c8af910beebc887eb2069c148425d84bf"
robolab_container_digest = "sha256:0ac1e96743f93315aae09daeba12fbfcc1d42d88a676e1bb2a76ee2c39ecdb77"
license = "open-mdw-1.1"

[model]
parameters = "16b"
transformer_layers = 36
hidden_size = 4096
joint_attention = "two_way"
action_domain = "droid_lerobot"
action_space = "absolute_joint_position"
raw_action_dimension = 8
model_action_dimension = 64
action_chunk = 32
raw_video_frames = 33
video_height = 540
video_width = 640
conditioning_fps = 15
sampler = "unipc"
denoising_steps = 4
shift = 5.0
guidance = 3.0

[validation]
deterministic_seed = true
exact_noop_required = true
maximum_noop_action_absolute_error = 0.0
maximum_noop_vision_latent_absolute_error = 0.0
maximum_action_coordinate_intervention_error = 0.0
gaussian_norm_relative_tolerance = 1e-5
gaussian_distance_relative_tolerance = 1e-5
replay_num_envs = 1
replay_state_absolute_tolerance = 0.0
fresh_environment_per_condition = true
server_process_is_blocking_factor = true
cross_process_bitwise_exactness_required = false
minimum_server_process_blocks = 3
decoded_target_top1_minimum = 0.90
decoded_factor_edge_direction_minimum = 0.90

[screen]
study_id = "cosmos3_robolab_screen_v1"
pilot_units_are_excluded = true
intervention_outcomes_may_not_enter_task_or_state_selection = true
pilot_tasks = [
  "BananaInBowlTask",
  "RubiksCubeTask",
  "MustardInLeftBinTask",
  "SpoonInMugTask",
  "MarkerInMugTask",
  "BagelsOnPlateTask",
  "YogurtInBowlTask",
  "SmartphoneInBinTask",
]
pilot_environment_seeds = [101, 103, 107]
confirmatory_environment_seeds = [101, 103, 107, 109, 113]
native_branch_seeds = [211, 223, 227, 229, 233, 239, 241, 251, 257, 263, 269, 271, 277, 281, 283, 293]
minimum_normalized_action_l2 = 0.01
minimum_endpoint_displacement_m = 0.003
minimum_confirmatory_tasks = 5
minimum_confirmatory_units = 20
maximum_units_per_task = 6

[screen.branch_points]
# Frozen from excluded seed-0 native trajectories before any population
# intervention.  Each point precedes the first substantive target-object
# displacement and is reused for every confirmatory environment seed.
BananaInBowlTask = 64
RubiksCubeTask = 64
MustardInLeftBinTask = 96
SpoonInMugTask = 128
MarkerInMugTask = 320
SmartphoneInBinTask = 64

[screen.selection]
task_rule = "retain tasks with at least one successful native rollout and at least one reachable endpoint-divergent donor pair; rank by eligible-unit count, then task name"
state_rule = "rank within task by native endpoint diversity, then environment seed; never use interventional outcomes"
donor_rule = "from the same exact state, select the maximum native action-L2 pair among all 16 seeds before physical execution; ties use the lower ordered seed pair; retain only if that fixed pair passes endpoint eligibility"
replacement_after_intervention = false
seed_expansion_rule = "before any population intervention, add seed 113 to all six calibration-feasible tasks after the four-seed native census remained below 20 eligible units; do not add further seeds after any population intervention begins"
reserve_task_rule = "before any population intervention, screen both declared reserve tasks at branch points fixed from excluded seed-0 trajectories; admit every reserve task with at least one successful native rollout and otherwise apply the unchanged population rules"

[screen.reserve_branch_points]
# Frozen from excluded seed-0 trajectories before reserve-task screening:
# Bagels first registered a target-object grab at step 70; Yogurt at step 215.
BagelsOnPlateTask = 64
YogurtInBowlTask = 192

[interventions]
recipient_diffusion_seeds = [1201, 1213, 1217]
gaussian_seed = 1223
reciprocal_pairs = true
future_latent_frames = "all unconditioned vision latent frames"
current_vision = "never replaced"
action_state = "never replaced"
primary_targets = ["self", "donor", "matched_natural", "gaussian", "shuffled_natural"]
timing_windows = ["step_0", "step_1", "step_2", "step_3", "all_steps"]

[factorization]
primary_design = "native_background_masked_composite"
difference_mask_rgb_threshold = 8
difference_mask_dilation_pixels = 2
robot_position_match_m = 0.003
robot_orientation_match_rad = 0.03
robot_gripper_match_l2 = 0.005
minimum_object_goal_l2 = 0.003
maximum_object_match_l2 = 0.0005
minimum_robot_position_l2_m = 0.003
minimum_robot_orientation_angle_rad = 0.03
minimum_robot_gripper_l2 = 0.003
confirmatory_minimum_units = 10
confirmatory_minimum_tasks = 5
selection_rule = "among primary-population units, rank within task by native target-object position separation then environment seed; select round-robin across tasks before any factorial intervention"
primary_action_contrasts = ["robot_main_effect", "object_main_effect"]
primary_physical_contrasts = ["robot_main_effect", "object_main_effect"]
current_frame_is_fixed = true
hybrid_targets_are_counterfactual = true
full_state_rerenders_are_secondary = true
replacement_after_intervention = false

[factorization.object_prims]
BananaInBowlTask = "/World/envs/env_0/banana"
RubiksCubeTask = "/World/envs/env_0/rubiks_cube"
MustardInLeftBinTask = "/World/envs/env_0/mustard"
SpoonInMugTask = "/World/envs/env_0/spoon_big"
MarkerInMugTask = "/World/envs/env_0/marker"
SmartphoneInBinTask = "/World/envs/env_0/smartphone"
BagelsOnPlateTask = "/World/envs/env_0/bagel_00"
YogurtInBowlTask = "/World/envs/env_0/yogurt_cup"

[attention_localization]
calibration_layers = "all 36 transformer layers"
interfaces = ["vision_key_value_to_action_query", "action_key_value_to_action_query"]
controls = ["equal_count_current_vision", "equal_count_text", "random_layer"]
selection_rule = "choose the smallest contiguous layer window maximizing donor-minus-self action steering on calibration units"
confirmatory_layers_are_frozen = true

[outcomes]
primary = "normalized_action_donor_steering"
secondary = [
  "executed_endpoint_donor_steering",
  "correct_donor_top1_rate",
  "decoded_future_target_top1_rate",
  "object_only_executed_goal_steering",
  "robot_only_executed_robot_steering",
]

[inference]
cluster_unit = "saved_simulator_state"
bootstrap_resamples = 10000
familywise_alpha = 0.05
smallest_effect_of_interest = 0.10
