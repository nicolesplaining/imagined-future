study_name = "fastwam_optional_idm_smoke_v2_pairwise_first_frame"

# These seeds are fixed before inspecting any generated future or intervention
# output. Each paired branch has independent video and action noise.
video_seeds = [101, 211, 307, 401]
action_seeds = [1009, 2017, 3019, 4021]

[inference]
num_inference_steps = 20
sigma_shift = 1.0
num_video_frames = 9
action_horizon = 32
rand_device = "cpu"

